# Render Blueprint for the Shift backend (API + socket.io).
# The database lives on Neon; paste its connection string as DATABASE_URL
# when Render asks for it.
services:
  - type: web
    name: shift-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGINS
        value: https://shift-tic-tac-toe.vercel.app,http://localhost:5173
